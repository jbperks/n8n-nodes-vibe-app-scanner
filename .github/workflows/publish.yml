name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version matching the selected v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EXPECTED_VERSION: ${{ inputs.version }}
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Check release identity
        run: node scripts/release-guard.cjs
      - name: Install pinned publishing CLI
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check:package
      - name: Stage archive with provenance (not public until approved)
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
